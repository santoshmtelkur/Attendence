spring:
  application:
    name: attendance-system
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jackson:
    default-property-inclusion: non_null
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:this-is-a-local-dev-secret-key-change-in-production-32bytes}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:attendance-noreply@college.edu}}
    enabled: ${MAIL_ENABLED:false}
  attendance:
    low-threshold: ${LOW_ATTENDANCE_THRESHOLD:75}
    digest-cron: ${DIGEST_CRON:0 0 8 * * MON}
  seed:
    enabled: ${SEED_DEMO_DATA:true}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
